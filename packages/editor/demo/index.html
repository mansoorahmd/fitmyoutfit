<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitMyOutfit editor demo</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font: 14px system-ui, sans-serif; color: #1d2330; background: #fff; }
      button { font: inherit; padding: 6px 10px; border: 1px solid #b8c0cc; border-radius: 6px; background: #f6f8fa; color: inherit; cursor: pointer; min-height: 34px; }
      button:disabled { opacity: 0.45; cursor: default; }
      button[aria-pressed="true"] { background: #dbe8ff; border-color: #0a66ff; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #0a66ff; outline-offset: 1px; }
      input, select { font: inherit; padding: 5px 8px; border: 1px solid #b8c0cc; border-radius: 6px; min-height: 34px; box-sizing: border-box; }
      .demo { display: flex; flex-direction: column; height: 100%; }
      .demo-header { padding: 8px 14px; border-bottom: 1px solid #dde2ea; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
      .demo-header h1 { font-size: 16px; margin: 0; }
      .history { display: flex; gap: 6px; }
      .status-ok { color: #1a7f37; }
      .status-bad { color: #b42318; }
      .demo-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 420px; }
      .viewer { position: relative; min-height: 0; background: #eef1f5; }
      .viewer-hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #5b6475; pointer-events: none; }
      .model-credit { position: absolute; right: 10px; bottom: 6px; max-width: 48%; margin: 0; font-size: 11px; line-height: 1.35; color: #4a5263; text-align: end; }
      .model-credit a { color: inherit; }
      .product-switch { display: inline-flex; align-items: center; gap: 6px; }
      .sides { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; }
      .sides button { background: rgba(255, 255, 255, 0.9); padding: 4px 8px; min-height: 30px; }
      .panel { overflow-y: auto; border-left: 1px solid #dde2ea; padding: 10px 14px 24px; }
      .panel section { margin-bottom: 14px; }
      .panel h2 { font-size: 14px; margin: 4px 0 8px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
      .row > span:first-child { min-width: 96px; color: #3b4352; }
      .row input[type="range"] { flex: 1; min-width: 150px; }
      .row.buttons { gap: 6px; }
      .add-row { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; align-items: center; }
      .add-row input:not([type]) { flex: 1; min-width: 120px; }
      .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
      .preset { font-size: 13px; padding: 4px 8px; min-height: 30px; }
      .upload { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #0a66ff; border-radius: 6px; padding: 4px 10px; background: #eef4ff; cursor: pointer; }
      .upload input { max-width: 190px; border: 0; padding: 0; min-height: 0; }
      .segmented { display: inline-flex; gap: 4px; }
      .messages ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      .msg { padding: 6px 8px; border-radius: 6px; font-size: 13px; line-height: 1.35; margin: 4px 0; }
      .msg-error { background: #fdecea; color: #8a1c12; border: 1px solid #f3b4ad; }
      .msg-warning { background: #fff6e0; color: #6b4a00; border: 1px solid #f1d08a; }
      .msg-info { background: #eef4ff; color: #1d3b72; border: 1px solid #c4d6f8; }
      .layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      .layer { display: flex; gap: 4px; align-items: stretch; }
      .layer button { padding: 4px 8px; font-size: 13px; }
      .layer-name { flex: 1; text-align: start; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
      .layer.selected .layer-name { background: #dbe8ff; border-color: #0a66ff; }
      .layer-piece { color: #5b6475; font-size: 12px; }
      .badge-warn { background: #f1d08a; color: #5a3d00; border-radius: 4px; padding: 0 5px; font-size: 11px; }
      .controls { border: 1px solid #c4d6f8; border-radius: 8px; padding: 8px 10px; background: #fafcff; }
      .zones { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      .zone-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .zone-chip { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #8a93a3; }
      .zone-name { font-weight: 600; }
      .zone-hex { color: #5b6475; font-size: 12px; font-variant-numeric: tabular-nums; }
      .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
      .swatch { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #8a93a3; padding: 0; cursor: pointer; min-height: 0; }
      .swatch.small { width: 28px; height: 28px; }
      .swatch[aria-pressed="true"] { outline: 3px solid #0a66ff; outline-offset: 2px; }
      details { margin-top: 12px; }
      summary { cursor: pointer; font-weight: 600; }
      .flat-pattern { width: 100%; max-width: 360px; aspect-ratio: 1; display: block; margin-top: 8px; background: repeating-conic-gradient(#f2f4f7 0 25%, #fff 0 50%) 0 0 / 16px 16px; border: 1px solid #dde2ea; }
      .close-up { width: 100%; height: auto; display: block; margin-top: 8px; background: repeating-conic-gradient(#f2f4f7 0 25%, #fff 0 50%) 0 0 / 16px 16px; border: 1px solid #dde2ea; }
      .team-panel { border: 1px solid #dde2ea; border-radius: 8px; padding: 6px 10px; }
      .team-slot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
      .team-slot[aria-pressed="true"], .segmented button[aria-pressed="true"], .preset[aria-pressed="true"] { background: #dbe8ff; border-color: #0a66ff; }
      .templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
      .template-card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px; font-size: 12px; background: #f2f4f7; }
      .template-card canvas { width: 120px; height: 150px; }
      .template-card.current { outline: 2px solid #0b1f3a; }
      .switches { gap: 10px 16px; }
      .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
      .plain-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 13px; }
      .code-match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
      .code-match p, .code-match .row { grid-column: 1 / -1; margin: 0; }
      .code-chip { display: flex; flex-direction: column; gap: 4px; }
      .code-chip span { width: 64px; height: 64px; border-radius: 8px; border: 1px solid #8a93a3; }
      .status-line { font-size: 13px; color: #1d3b72; }
      .note { color: #5b6475; font-size: 12px; margin: 6px 0 0; }
      .licences { font-size: 12px; color: #3b4352; padding-left: 18px; }
      pre.json { margin: 8px 0 0; padding: 8px; max-height: 260px; overflow: auto; background: #f6f8fa; font-size: 11px; }
      @media (max-width: 760px) {
        .demo { height: auto; min-height: 100%; }
        .demo-main { display: block; }
        .viewer { height: 52vh; height: 52svh; position: sticky; top: 0; z-index: 1; }
        .panel { border-left: 0; border-top: 1px solid #dde2ea; overflow: visible; }
        .demo-header h1 { font-size: 14px; width: 100%; }
        .swatches { gap: 7px; }
        .swatch { width: 37px; height: 37px; }
        .swatch.small { width: 32px; height: 32px; }
        .viewer-hint { display: none; }
        .model-credit { left: 8px; right: 8px; bottom: 4px; max-width: none; font-size: 10.5px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
